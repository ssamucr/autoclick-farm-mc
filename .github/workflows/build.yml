name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Build executable
      run: |
        pyinstaller --onefile --windowed --name "AutoClicker_Ssamucr" autoclick_gui.py
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v3
      with:
        name: AutoClicker_Ssamucr-Windows
        path: dist/AutoClicker_Ssamucr.exe
    
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          dist/AutoClicker_Ssamucr.exe
        body: |
          ## AutoClicker Ssamucr Release
          
          ### 📁 Archivos Incluidos
          - `AutoClicker_Ssamucr.exe` - Ejecutable principal para Windows
          
          ### 📋 Instrucciones
          1. Descarga `AutoClicker_Ssamucr.exe`
          2. Ejecuta el archivo (no requiere instalación)
          3. Configura y disfruta del AutoClicker
          
          ### ⚠️ Nota de Seguridad
          Algunos antivirus pueden detectar falsamente este ejecutable. Agrégalo a las excepciones si es necesario.
          
          Para más información, consulta el [README.md](README.md).
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}